<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pintu panel</title>
<style>
  body[data-theme="light"] { --bg: #f4f4f6; --card: #ffffff; --card-2: #ececf0; --line: rgba(0,0,0,.08); --text: #16161a; --muted: #6b6b76; --hover: rgba(0,0,0,.05); --teal: #2bb8a0; }
  body[data-theme="pastel"] { --bg: #fff5f9; --card: #ffeaf2; --card-2: #ffdbe9; --line: rgba(120,40,80,.12); --text: #3a2a35; --muted: #8a6c7d; --hover: rgba(120,40,80,.06); --teal: #ff8fb1; }
  body[data-theme="hacker"] { --bg: #020a04; --card: #07140a; --card-2: #0c1f10; --line: rgba(57,255,106,.14); --text: #b7ffb7; --muted: #4f9a5a; --hover: rgba(57,255,106,.07); --teal: #39ff6a;
                              font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  :root {
    --hover: rgba(255,255,255,.05);
    --bg: #000; --card: #131316; --card-2: #1b1b20; --line: rgba(255,255,255,.07);
    --text: #f5f5f7; --muted: #8e8e93;
    --working: #4da3ff; --question: #ffb830; --approval: #ff8a3d; --error: #ff5c5c; --done: #3ddc97; --idle: #8e8e93;
    --teal: #48d6be;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body { font: 14px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: var(--text);
         -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
  .panel { width: 380px; margin: 0 auto; background: var(--bg); border-radius: 22px; padding: 12px 12px 10px; transform-origin: 50% 0; animation: pop .24s cubic-bezier(.2,.9,.3,1.15) both;
           border: 1px solid var(--line); }
  header { display: flex; align-items: center; gap: 10px; padding: 0 4px 10px; }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; flex: 1; }
  .chip { font-size: 11px; color: var(--muted); background: var(--card); border-radius: 999px; padding: 4px 10px; }
  .hero { display: flex; align-items: center; gap: 12px; padding: 10px; margin-bottom: 8px; border-radius: 18px; }
  .tile { width: 92px; height: 84px; cursor: pointer; flex: none; display: grid; place-items: center; border-radius: 15px; background: var(--card-2); }
  .tile canvas { width: 88px; height: 80px; image-rendering: pixelated; }
  .headline { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .actions { display: flex; justify-content: space-around; padding: 10px 0 2px; }
  .actions button { background: none; border: 0; color: var(--text); font: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
                    display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .actions span { width: 40px; height: 40px; border-radius: 50%; background: var(--card); display: grid; place-items: center; }
  .actions button:hover span { background: var(--card-2); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-bottom: 8px; }
  .card { background: var(--card); border-radius: 16px; padding: 10px 12px; border: 1px solid var(--line); }
  .card h2 { font-size: 11.5px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); box-shadow: 0 0 10px var(--c, transparent); }
  .big { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 1px; color: var(--c, var(--text)); }
  .big small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .sub { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agents { padding: 4px 6px; margin-bottom: 8px; max-height: 190px; overflow-y: auto; scrollbar-width: none; }
  .agents::-webkit-scrollbar { display: none; }
  .agents h2 { padding: 6px 6px 4px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 12px; cursor: pointer; }
  .row:hover { background: var(--hover); }
  .item + .item { border-top: 1px solid var(--line); }
  .face { width: 36px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 10px;
          background: color-mix(in srgb, var(--c) 14%, transparent); }
  .face img { width: 30px; height: 27px; image-rendering: pixelated; }
  .who { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .right { text-align: right; flex: none; }
  .pill { display: inline-block; font-size: 10.5px; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent);
          border-radius: 999px; padding: 3px 9px; }
  .time { font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--text); margin-top: 4px; }
  .took { color: var(--muted); font-size: 11px; }
  .xp { display: flex; align-items: center; gap: 8px; padding: 0 4px 8px; font-size: 11px; color: var(--muted); }
  .xp .bar { flex: 1; height: 5px; border-radius: 5px; background: var(--card-2); overflow: hidden; }
  .xp .bar i { display: block; height: 100%; background: var(--teal); border-radius: 5px; transition: width .6s ease; }
  .xp b { color: var(--text); font-weight: 700; }
  .friends { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 2px 8px; }
  .friends:empty { display: none; }
  .friend { width: 46px; text-align: center; font-size: 9.5px; color: var(--muted); }
  .friend canvas { width: 44px; height: 40px; image-rendering: pixelated; display: block; background: var(--card); border-radius: 10px; }
  .friend span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .banner { display: none; margin-bottom: 8px; }
  .banner > div { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 12px; padding: 7px 10px; font-size: 12px; margin-bottom: 4px; }
  .banner > div span { flex: 1; } .banner button { border: 0; border-radius: 9px; padding: 4px 10px; font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; background: var(--teal); color: #04110e; }
  .tl { position: absolute; top: 4px; right: 26px; width: 18px; height: 18px; border-radius: 50%; border: 0; background: rgba(128,128,128,.18); color: var(--muted); font-size: 10px; cursor: pointer; opacity: 0; transition: opacity .12s; padding: 0; line-height: 1; }
  .row:hover .tl { opacity: 1; }
  .timeline { padding: 2px 10px 8px 56px; font-size: 11px; color: var(--muted); }
  .timeline div { display: flex; gap: 6px; padding: 1px 0; } .timeline i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); margin-top: 4px; flex: none; }
  .timeline span:first-of-type { flex: 1; color: var(--text); }
  /* layouts: the panel is a grid, so vertical and horizontal are just different areas */
  .panel { display: grid; grid-template-columns: minmax(0, 1fr);
           grid-template-areas: "head" "xp" "set" "ban" "hero" "frnd" "stat" "agents" "today" "act" "foot"; }
  header { grid-area: head; } #xp { grid-area: xp; } .settings { grid-area: set; } .banner { grid-area: ban; } .hero { grid-area: hero; }
  .friends { grid-area: frnd; } .grid { grid-area: stat; } #agents { grid-area: agents; } #today { grid-area: today; } .actions { grid-area: act; } footer { grid-area: foot; }
  body.layout-h .panel { width: 760px; column-gap: 12px; align-content: start;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "head head" "xp xp" "set set" "ban ban" "hero agents" "frnd agents" "stat agents" "today agents" "act act" "foot foot"; }
  body.layout-h .agents { max-height: none; }
  body.layout-h.live .panel { width: 100%; }
  body.size-small { zoom: .88; } body.size-large { zoom: 1.15; }
  body.no-anim .panel { animation: none; }
  body.no-hero .hero, body.no-xp #xp, body.no-friends .friends, body.no-stats .grid, body.no-agents #agents, body.no-today #today, body.no-actions .actions { display: none !important; }
  .settings { max-height: 560px; overflow-y: auto; scrollbar-width: none; }
  .set-h { margin: 10px 0 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .gear { background: var(--card); border: 0; color: var(--muted); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
  .gear:hover { background: var(--card-2); color: var(--text); }
  .settings { display: none; margin-bottom: 8px; }
  body.settings-open .settings { display: block; }
  body.settings-open .hero, body.settings-open .grid, body.settings-open #agents, body.settings-open #today, body.settings-open .actions { display: none; }
  .set { display: flex; align-items: center; gap: 8px; padding: 7px 2px; font-size: 12.5px; border-top: 1px solid var(--line); }
  .set:first-of-type { border-top: 0; }
  .set > span:first-child { flex: 1; } .set i { color: var(--muted); font-style: normal; }
  .set.sub { justify-content: flex-end; padding-top: 0; color: var(--muted); font-size: 12px; }
  .set input[type=range] { width: 120px; accent-color: var(--teal); } .set b { width: 28px; text-align: right; font-weight: 600; }
  .set input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--teal); }
  .set input[type=time], .set select { background: var(--card-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; font: inherit; font-size: 12px; }
  .wide { width: 100%; margin-top: 8px; padding: 8px; border-radius: 12px; border: 0; background: var(--card-2); color: var(--text); font: inherit; font-weight: 600; font-size: 12.5px; cursor: pointer; }
  .wide:hover { filter: brightness(1.15); } .wide.ghost { background: transparent; color: var(--muted); }
  .x { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; border: 0; background: rgba(255,255,255,.08); color: var(--muted);
       font-size: 12px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity .12s; }
  .row { position: relative; } .row:hover .x { opacity: 1; } .x:hover { background: var(--error); color: #fff; }
  .rm { color: var(--muted); text-decoration: underline; cursor: pointer; margin-left: 4px; } .rm:hover { color: var(--error); }
  .stuck { color: var(--question); font-size: 11.5px; }
  .empty { text-align: center; padding: 14px 12px 16px; color: var(--muted); font-size: 13px; }
  .empty img { width: 80px; image-rendering: pixelated; display: block; margin: 0 auto 8px; }
  .empty code { background: var(--card-2); border-radius: 6px; padding: 1px 6px; color: var(--text); }
  .today .top { display: flex; align-items: baseline; justify-content: space-between; }
  .today .stat { font-size: 13px; color: var(--muted); }
  .today .stat b { color: var(--text); font-size: 15px; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 34px; margin-top: 8px; }
  .bars i { flex: 1; background: var(--teal); border-radius: 5px 5px 2px 2px; min-height: 4px; opacity: .9; }
  .bars { position: relative; }
  .bars i { cursor: default; transition: filter .12s, opacity .12s; }
  .bars i:hover { opacity: 1; filter: brightness(1.2); }
  .tip { position: absolute; bottom: calc(100% + 6px); transform: translateX(-50%); background: var(--card-2); border: 1px solid var(--line);
         border-radius: 9px; padding: 5px 8px; font-size: 11px; line-height: 1.35; white-space: nowrap; pointer-events: none; display: none; z-index: 4; }
  .tip b { color: var(--text); } .tip span { color: var(--muted); }
  .bars i.zero { background: var(--card-2); opacity: 1; }
  .axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 6px; }
  footer { display: flex; justify-content: space-between; color: var(--muted); font-size: 10.5px; padding: 8px 6px 0; }
  body.live { background: var(--bg); }
  html:has(body.live) { background: var(--bg); }
  body.live .panel { width: 100%; border-radius: 0; border: 0; }
  @keyframes pop { from { opacity: 0; transform: translateY(-10px) scale(.94); } to { opacity: 1; transform: none; } }
  body.out .panel { animation: none; opacity: 0; transform: translateY(-8px) scale(.96); transition: opacity .15s ease, transform .15s ease; }
  #herosub { transition: opacity .25s ease; position: relative; background: var(--card-2); border-radius: 12px; padding: 6px 9px; margin-top: 6px; font-size: 12px; color: var(--text); white-space: normal; }
  #herosub::before { content: ""; position: absolute; left: -5px; top: 10px; border: 5px solid transparent; border-left: 0; border-right-color: var(--card-2); }
  #herosub.fade { opacity: 0; }
</style>
</head>
<body>
<div class="panel" id="panel">
  <header>
    <h1>Pintu</h1>
    <span class="chip" id="count">0 agents</span>
    <button class="gear" id="gear" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div class="xp" id="xp"></div>

  <div class="card settings" id="settings">
    <h2>Settings</h2>
    <div class="set-h">Look</div>
    <label class="set"><span>Layout</span><select id="s-layout" data-str="1"><option value="vertical">Vertical</option><option value="horizontal">Horizontal (wide)</option></select></label>
    <label class="set"><span>Size</span><select id="s-size" data-str="1"><option value="small">Small</option><option value="normal">Normal</option><option value="large">Large</option></select></label>
    <label class="set"><span>Theme</span><select id="s-theme" data-str="1"><option value="dark">Dark</option><option value="light">Light</option><option value="pastel">Pastel</option><option value="hacker">Hacker</option></select></label>
    <label class="set"><span>Chart shows</span><select id="s-chart" data-str="1"><option value="hours">Last 12 hours</option><option value="days">Last 7 days</option></select></label>
    <label class="set"><span>Agent rows before scrolling</span><select id="s-rows"><option value="3">3</option><option value="5">5</option><option value="8">8</option><option value="0">All</option></select></label>
    <label class="set"><span>Hide finished agents</span><input type="checkbox" id="s-hidedone"></label>
    <label class="set"><span>Animations</span><input type="checkbox" id="s-anim"></label>
    <div class="set-h">Show these parts</div>
    <label class="set"><span>Pintu card</span><input type="checkbox" class="sec" data-sec="hero"></label>
    <label class="set"><span>Level bar</span><input type="checkbox" class="sec" data-sec="xp"></label>
    <label class="set"><span>Friends row</span><input type="checkbox" class="sec" data-sec="friends"></label>
    <label class="set"><span>Needs you / Working cards</span><input type="checkbox" class="sec" data-sec="stats"></label>
    <label class="set"><span>Agent list</span><input type="checkbox" class="sec" data-sec="agents"></label>
    <label class="set"><span>Chart</span><input type="checkbox" class="sec" data-sec="today"></label>
    <label class="set"><span>Buttons</span><input type="checkbox" class="sec" data-sec="actions"></label>
    <div class="set-h">Alerts</div>
    <label class="set"><span>Volume</span><input type="range" min="0" max="100" id="s-volume"><b id="s-volume-n"></b></label>
    <label class="set"><span>Sound</span><input type="checkbox" id="s-sound"></label>
    <label class="set"><span>Notifications</span><input type="checkbox" id="s-notify"></label>
    <label class="set"><span>Animated Pintu popup <i>(macOS)</i></span><input type="checkbox" id="s-toast"></label>
    <label class="set"><span>"Maybe stuck?" alerts</span><input type="checkbox" id="s-stuck"></label>
    <label class="set"><span>Skip "done" while the agent's app is focused</span><input type="checkbox" id="s-focus"></label>
    <label class="set"><span>Quiet hours</span><input type="checkbox" id="s-quiet"></label>
    <div class="set sub" id="s-quiet-times"><span>From</span><input type="time" id="s-qs"><span>to</span><input type="time" id="s-qe"></div>
    <label class="set"><span>Pintu speaks out loud</span><input type="checkbox" id="s-voice"></label>
    <label class="set"><span>Robot voice</span><input type="checkbox" id="s-funny"></label>
    <label class="set"><span>Break reminder</span><input type="checkbox" id="s-break"></label>
    <label class="set"><span>Remind me after</span><select id="s-breakmin"><option value="25">25 min</option><option value="50">50 min</option><option value="90">90 min</option></select></label>
    <label class="set"><span>Mute button lasts</span>
      <select id="s-mute"><option value="30">30 min</option><option value="60">1 hour</option><option value="120">2 hours</option><option value="240">4 hours</option></select></label>
    <button class="wide" id="s-stale">Remove all stale agents</button>
    <button class="wide ghost" id="s-back">Done</button>
  </div>

  <div class="banner" id="banner"></div>

  <div class="card hero">
    <div class="tile"><canvas id="pet" width="132" height="120"></canvas></div>
    <div class="who"><div class="headline" id="headline"></div><div class="sub" id="herosub"></div></div>
  </div>

  <div class="friends" id="friends"></div>

  <div class="grid">
    <div class="card" id="needs"></div>
    <div class="card" id="working"></div>
  </div>

  <div class="card agents" id="agents"></div>

  <div class="card today" id="today"></div>

  <div class="actions">
    <button data-act="clear"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>Clear done</button>
    <button data-act="doctor"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/></svg></span>Test alert</button>
    <button data-act="mute"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></span><i id="mute-label" style="font-style:normal">Mute 1h</i></button>
    <button data-act="break"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v7a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4zM6 2v3M10 2v3M14 2v3"/></svg></span><i id="break-label" style="font-style:normal">Break 5m</i></button>
    <button data-act="quit"><span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10M5.6 6.6a9 9 0 1 0 12.8 0"/></svg></span>Quit</button>
  </div>

  <footer><span>pintumcp</span><span id="updated"></span></footer>
</div>

<script src="pet.js"></script>
<script>
const COLOR = {working: "var(--working)", question: "var(--question)", approval: "var(--approval)",
               error: "var(--error)", done: "var(--done)", idle: "var(--idle)"};
const LABEL = {working: "Working", question: "Needs input", approval: "Needs approval",
               error: "Error", done: "Done", idle: "Idle"};
const $ = (id) => document.getElementById(id);
let skew = 0, current = null;

let post = (msg) => { if (window.webkit?.messageHandlers?.pintu) window.webkit.messageHandlers.pintu.postMessage(msg); };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const now = () => Date.now() / 1000 - skew;

function clock(sec) {                       // 4:12 or 1:12:05
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}
function span(sec) {                        // 4m 12s, 1h 12m
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return `${sec}s`;
  const m = Math.floor(sec / 60);
  return m < 60 ? `${m}m ${String(sec % 60).padStart(2, "0")}s` : `${Math.floor(m / 60)}h ${m % 60}m`;
}
const expanded = new Set();
function timeline(a) {                       // what this agent did lately, newest first
  const at = (s) => new Date(s * 1000).toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  const rows = (a.history || []).map((h) => `<div style="--c:${COLOR[h.state] || COLOR.idle}"><i></i><span>${LABEL[h.state] || h.state}</span><span>${span(h.dur)}</span><span>${at(h.at)}</span></div>`).join("");
  return `<div class="timeline">${rows || "No history yet."}</div>`;
}
function applyLook(s) {                      // layout, size, which parts show, list length, animations
  const b = document.body.classList, sec = s.sections || {};

    if (msg.type === "size") fetch(`/act/size?h=${Math.ceil(msg.height) + 2}&w=${Math.ceil(msg.width)}&t=${token}`, {method: "POST"});

  poll(); setInterval(() => active && poll(), 1000);

}
